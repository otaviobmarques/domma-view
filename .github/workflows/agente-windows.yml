# Gera o instalador do Domma View para Windows num Windows de verdade.
# - Em todo push que mexe no agente: build + autoteste de mouse; o .exe fica nos artefatos do workflow.
# - Em tag agente-v*: publica o .exe numa Release (o servidor baixa de lá via WINDOWS_INSTALLER_URL).
# Endereço do servidor gravado no instalador: variável do repositório DV_SERVER_URL (Settings → Variables).
name: Agente Windows

on:
  push:
    paths: ['agent-desktop/**', 'agent-service/**', 'test/service-e2e.js', '.github/workflows/agente-windows.yml']
    tags: ['agente-v*']
  workflow_dispatch:
    inputs:
      server_url:
        description: 'Endereço do servidor (ex.: https://view.suaempresa.com.br)'
        required: false
      release:
        description: 'Publicar como versão (ex.: agente-v1.0.0); vazio = só gerar o artefato'
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: agent-desktop
    env:
      DV_SERVER_URL: ${{ github.event.inputs.server_url || vars.DV_SERVER_URL || 'http://localhost:3000' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: agent-desktop/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: agent-service/go.sum
      - name: Compilar o serviço do Windows
        working-directory: agent-service
        run: go build -trimpath -ldflags "-s -w" -o dist/DommaViewService.exe .
      - run: npm ci
      - name: Autoteste de mouse (SendInput)
        run: node scripts/selftest-input.js
      - name: Gerar instalador
        run: npm run dist:win
      - name: Nome estável para download
        shell: bash
        run: cp dist/DommaView-Setup-*.exe dist/DommaView-Setup.exe
      - uses: actions/upload-artifact@v4
        with:
          name: DommaView-Setup
          path: agent-desktop/dist/DommaView-Setup.exe
          retention-days: 30
      - name: Publicar na Release
        if: startsWith(github.ref, 'refs/tags/agente-v') || github.event.inputs.release != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.release || github.ref_name }}
        run: |
          gh release create "$TAG" dist/DommaView-Setup.exe --target "$GITHUB_SHA" --title "Domma View para Windows ${TAG#agente-v}" --notes "Instalador do agente Domma View para Windows. Servidor - $DV_SERVER_URL" || gh release upload "$TAG" dist/DommaView-Setup.exe --clobber

  servico:
    # Instala o serviço num Windows de verdade e testa contra um servidor local
    runs-on: windows-latest
    env:
      ADMIN_EMAIL: admin@domma.local
      ADMIN_PASSWORD: teste-servico-123
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: agent-service/go.sum
      - name: Compilar o serviço
        working-directory: agent-service
        run: go build -o dist/DommaViewService.exe .
      - run: npm ci
      - name: Subir o servidor local
        shell: pwsh
        run: |
          Start-Process -FilePath node -ArgumentList 'server/index.js' -RedirectStandardOutput server.log -RedirectStandardError server.err
          for ($i = 0; $i -lt 30; $i++) { try { Invoke-WebRequest http://127.0.0.1:3000/api/config -UseBasicParsing | Out-Null; break } catch { Start-Sleep 1 } }
      - name: Diagnóstico do auxiliar (captura e cursor nesta sessão)
        run: agent-service\dist\DommaViewService.exe selftest
        continue-on-error: true
      - name: Teste do serviço
        run: node test/service-e2e.js
      - name: Registros
        if: always()
        shell: pwsh
        run: |
          Get-Content C:\ProgramData\DommaView\service.log -ErrorAction SilentlyContinue
          Get-Content C:\ProgramData\DommaView\helper.log -ErrorAction SilentlyContinue
          Get-Content server.err -ErrorAction SilentlyContinue | Select-Object -Last 20
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: servico-quadro
          path: ${{ runner.temp }}/quadro-servico.jpg
          if-no-files-found: ignore
